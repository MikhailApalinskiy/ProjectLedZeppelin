- changeSet:
    id: 1762619049825-5
    author: misha (generated)
    changes:
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 1
        - column:
            name: quest_node_id
            valueNumeric: 1
        - column:
            name: text
            value: 'Ты вскакиваешь на холодной скамье платформы метро. В висках стучит,
              лёгкие рвёт кашель — и внезапно вспышка памяти: фары грузовика, визг
              тормозов, удар. Но ты жив… в другом теле. На ладонях — чужие шрамы,
              в кармане — сложенный листок с номером телефона и словом: «АЛЕТЕЯ».
              У края платформы кто-то стоит слишком близко.'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762521297717.png
        - column:
            name: quest_id
            value: a7e73427-1a39-4890-8025-d63d1900d745
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 2
        - column:
            name: quest_node_id
            valueNumeric: 2
        - column:
            name: text
            value: 'В отражении тёмного окна — не твоё лицо. За ухом — крошечная татуировка:
              «OML-27». В бумажнике адрес, написанный твоим почерком: «Ул. Фолкнер,
              12. Не забудь обещание». Чужая кожа, твои заметки.'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762521836939.png
        - column:
            name: quest_id
            value: a7e73427-1a39-4890-8025-d63d1900d745
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 3
        - column:
            name: quest_node_id
            valueNumeric: 3
        - column:
            name: text
            value: 'Связь щёлкает. Холодный голос отвечает почти сразу: «Клиника ‘Алетея’.
              Протокол ‘One More Life’. Идентификатор OML-27 подтверждён. Мы можем
              помочь завершить цикл».'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762522007888.png
        - column:
            name: quest_id
            value: a7e73427-1a39-4890-8025-d63d1900d745
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 4
        - column:
            name: quest_node_id
            valueNumeric: 4
        - column:
            name: text
            value: У края платформы стоит молодой парень. Глаза пустые. Поезда ещё
              нет, но ветер из тоннеля уже шевелит его пальто.
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762522574157.png
        - column:
            name: quest_id
            value: a7e73427-1a39-4890-8025-d63d1900d745
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 5
        - column:
            name: quest_node_id
            valueNumeric: 5
        - column:
            name: text
            value: 'Дверь на Фолкнер, 12 открыта твоим ключом — каким-то образом он
              лежал в кармане. Внутри — записанная тобой кассета и записка: «Три якоря:
              ИМЯ, ОБЕЩАНИЕ, СВИДЕТЕЛЬ. Пока помнишь хотя бы один — ты всё ещё ты».'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762522781524.png
        - column:
            name: quest_id
            value: a7e73427-1a39-4890-8025-d63d1900d745
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 6
        - column:
            name: quest_node_id
            valueNumeric: 6
        - column:
            name: text
            value: Ты выбираешь проверить петлю. Шаг — и всё кончается быстро. Боль.
              Тьма. А потом — свет, соль на губах и детский плач. Ты просыпаешься
              в новом, маленьком теле на тёплом песке у моря.
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762522985967.png
        - column:
            name: quest_id
            value: a7e73427-1a39-4890-8025-d63d1900d745
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 7
        - column:
            name: quest_node_id
            valueNumeric: 7
        - column:
            name: text
            value: 'Клиника «Алетея». Белые стены, шёпот кондиционеров. Врач без имени
              листает твоё дело: «Вы — участник протокола переноса. Каждая смерть
              — новая инкарнация с частичной памятью. У вас осталось немного итераций.
              Мы можем мягко завершить цикл… или вы можете оборвать систему сами».'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762523136750.png
        - column:
            name: quest_id
            value: a7e73427-1a39-4890-8025-d63d1900d745
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 8
        - column:
            name: quest_node_id
            valueNumeric: 8
        - column:
            name: text
            value: 'Ты — ребёнок у моря. Но память не отпускает: имена, лица, ошибки.
              На набережной старушка внимательно смотрит на тебя, как будто знает,
              кто ты на самом деле.'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762523768901.png
        - column:
            name: quest_id
            value: a7e73427-1a39-4890-8025-d63d1900d745
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 9
        - column:
            name: quest_node_id
            valueNumeric: 9
        - column:
            name: text
            value: 'Старушка улыбается: «Мы встречались. Я обещала помнить тебя, если
              ты забудешь себя. Ты клялся: пока сможешь — спасай других. Так однажды
              спасёшь и себя». Её ладонь тёплая, как утро.'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762525474017.png
        - column:
            name: quest_id
            value: a7e73427-1a39-4890-8025-d63d1900d745
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 10
        - column:
            name: quest_node_id
            valueNumeric: 10
        - column:
            name: text
            value: Ты говоришь тихо и честно — о страхе, вине и праве на ещё один
              шанс. Парень всхлипывает, кивает и отступает от края. Поезд влетает
              на станцию, а вы стоите целые. Внутри — лёгкость, как будто первый раз
              дышишь по-настоящему.
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762523414763.png
        - column:
            name: quest_id
            value: a7e73427-1a39-4890-8025-d63d1900d745
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 11
        - column:
            name: quest_node_id
            valueNumeric: 11
        - column:
            name: text
            value: Серверная гудит, как улей. Несколько команд — и экраны чернеют.
              Протокол ‘One More Life’ рушится. Где-то в городе чьи-то судьбы не получат
              второй попытки, но петля над тобой разжимается. Тишина звенит.
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762523933593.png
        - column:
            name: quest_id
            value: a7e73427-1a39-4890-8025-d63d1900d745
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 12
        - column:
            name: quest_node_id
            valueNumeric: 12
        - column:
            name: text
            value: 'Ты ложишься в мягкое кресло. Свет становится тёплым. Врач шепчет:
              «Пора домой». Последняя мысль — не о смерти, а о завершённости. Ты сделал,
              что мог. Этого достаточно.'
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762524051945.png
        - column:
            name: quest_id
            value: a7e73427-1a39-4890-8025-d63d1900d745
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 13
        - column:
            name: quest_node_id
            valueNumeric: 13
        - column:
            name: text
            value: 'Вода. Шум. Тьма. Снова рождение. Снова память. Цикл вращается,
              как колесо. Ты понимаешь: без выбора — нет выхода.'
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762525324098.png
        - column:
            name: quest_id
            value: a7e73427-1a39-4890-8025-d63d1900d745
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 14
        - column:
            name: quest_node_id
            valueNumeric: 14
        - column:
            name: text
            value: Ты называешь своё имя вслух — то самое, первое. Вина отпускает,
              как тугая лента. Мир не меняется, но петля внутри тебя рвётся. Ты идёшь
              дальше — не из страха перед смертью, а из любви к жизни.
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762525608007.png
        - column:
            name: quest_id
            value: a7e73427-1a39-4890-8025-d63d1900d745
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 15
        - column:
            name: quest_node_id
            valueNumeric: 1
        - column:
            name: text
            value: "Лондон. 1953 год. Дождь превращает мостовую в зеркало, по кото\
              рому скользят редкие огни фонарей. Ты — частный детектив Майкл Кроуф\
              орд. К тебе обратилась миссис Грей — её дочь пропала без следа три д\
              ня назад.\r\nНа улице стоит туман, густой, как молоко. Он скрывает д\
              ома, вывески, даже собственные шаги."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762518869940.png
        - column:
            name: quest_id
            value: 96566d0a-7162-43d8-b285-971bba0374a4
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 16
        - column:
            name: quest_node_id
            valueNumeric: 2
        - column:
            name: text
            value: 'Дом Грей тих и заперт. Соседка шепчет из-за двери: «Ночами тут
              кто-то ходит. Туман приносит шаги». Внутри — разбросанные вещи, на стене
              зеркала запотели, но одно из них отражает улицу, которой нет за окном.'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762519002589.png
        - column:
            name: quest_id
            value: 96566d0a-7162-43d8-b285-971bba0374a4
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 17
        - column:
            name: quest_node_id
            valueNumeric: 3
        - column:
            name: text
            value: 'Полицейские не рады тебе. Дежурный говорит: «Город сошёл с ума.
              Карты не совпадают с улицами, а дома появляются там, где вчера их не
              было». Он протягивает тебе фотографию: девушка стоит на фоне моста,
              которого ты не узнаёшь.'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762519168481.png
        - column:
            name: quest_id
            value: 96566d0a-7162-43d8-b285-971bba0374a4
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 18
        - column:
            name: quest_node_id
            valueNumeric: 4
        - column:
            name: text
            value: 'Доки поглощены туманом. Вдалеке слышно, как скрипит металлическая
              цепь. Ты находишь брошенный зонт, на рукояти выгравированы инициалы:
              **E.G.** — Элизабет Грей. Возле воды — отпечатки босых ног, ведущие
              в никуда.'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762519303981.png
        - column:
            name: quest_id
            value: 96566d0a-7162-43d8-b285-971bba0374a4
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 19
        - column:
            name: quest_node_id
            valueNumeric: 5
        - column:
            name: text
            value: 'Комната девушки кажется обычной, пока ты не замечаешь открытую
              тетрадь. На полях — слова: *«Город живой. Он меня зовёт».* Последняя
              страница исписана координатами, которых не существует на карте.'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762519447704.png
        - column:
            name: quest_id
            value: 96566d0a-7162-43d8-b285-971bba0374a4
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 20
        - column:
            name: quest_node_id
            valueNumeric: 6
        - column:
            name: text
            value: 'Ты смотришь в зеркало — и видишь себя стоящим на другой улице,
              где туман плотнее. В отражении позади тебя движется женская фигура.
              Она шепчет: «Ты опоздал, Майкл».'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762519603382.png
        - column:
            name: quest_id
            value: 96566d0a-7162-43d8-b285-971bba0374a4
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 21
        - column:
            name: quest_node_id
            valueNumeric: 7
        - column:
            name: text
            value: Ты идёшь по улицам, но Лондон словно меняется с каждым шагом. Таблички
              исчезают, дома перетекают друг в друга. И вдруг впереди — мост из фотографии.
              Но он ведёт в туман, а под ним течёт не вода, а серое свечение.
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762519727158.png
        - column:
            name: quest_id
            value: 96566d0a-7162-43d8-b285-971bba0374a4
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 22
        - column:
            name: quest_node_id
            valueNumeric: 8
        - column:
            name: text
            value: Ты возвращаешься в центр города, но не узнаёшь улиц. Куда бы ты
              ни пошёл, вывески меняются, переулки ведут туда же, откуда ты пришёл.
              Кажется, Лондон пытается тебя запутать.
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762519923841.png
        - column:
            name: quest_id
            value: 96566d0a-7162-43d8-b285-971bba0374a4
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 23
        - column:
            name: quest_node_id
            valueNumeric: 9
        - column:
            name: text
            value: "Ты делаешь шаг — и туман отступает. Перед тобой стоит Элизабет\
              . Глаза её пусты, голос тих:\r\n— Город забрал меня... теперь он заб\
              ирает тебя.\r\nОна растворяется, и ты видишь своё отражение на мокро\
              м асфальте — но лицо уже не твоё."
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762520071125.png
        - column:
            name: quest_id
            value: 96566d0a-7162-43d8-b285-971bba0374a4
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 24
        - column:
            name: quest_node_id
            valueNumeric: 10
        - column:
            name: text
            value: "Ты разбиваешь зеркало — и вместе с ним рушится дом. За осколка\
              ми тянется улица, которой не существует на карте. На секунду ты види\
              шь Элизабет, стоящую в арке света.\r\n — Ты выбрал видеть правду, Ма\
              йкл.\r\nТуман рассеивается. Улицы возвращаются на место, но девушка\
              \ исчезает навсегда."
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762520212731.png
        - column:
            name: quest_id
            value: 96566d0a-7162-43d8-b285-971bba0374a4
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 25
        - column:
            name: quest_node_id
            valueNumeric: 11
        - column:
            name: text
            value: "Ты переходишь мост. За спиной исчезает город, впереди — тишина\
              . В небе висит тусклый диск солнца, и ты понимаешь: это не Лондон. Э\
              то его отражение.\r\nГде-то в тумане звучит твой собственный голос:\r\
              \n— Случай закрыт. Детектив найден."
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762520408374.png
        - column:
            name: quest_id
            value: 96566d0a-7162-43d8-b285-971bba0374a4
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 26
        - column:
            name: quest_node_id
            valueNumeric: 1
        - column:
            name: text
            value: "Ты просыпаешься на холодном металлическом полу. Вокруг — полум\
              рак, мигают красные индикаторы, из вентиляции тянет пылью и озоном.\r\
              \nНа стене тускло мерцает надпись: “Сектор 7. Персонал эвакуирован.”\
              \r\nГолос, без эмоций, но с едва заметной интонацией любопытства, ра\
              здаётся из потолочных динамиков:\r\n— Субъект 42 активирован. С возв\
              ращением. Как ты себя чувствуешь?\r\nТы пытаешься вспомнить своё имя\
              . Пустота.\r\nВ голове звучит странный ритм — будто импульсы процесс\
              ора."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762516454730.png
        - column:
            name: quest_id
            value: d9538403-f3ba-45e1-8b9c-1a96d3d4836b
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 27
        - column:
            name: quest_node_id
            valueNumeric: 2
        - column:
            name: text
            value: "— Кто ты? Что со мной произошло?\r\n— Я — Система. Я следила з\
              а твоим восстановлением. Ты был повреждён... но мы собрали тебя. Тво\
              ё тело больше не биологическое. Ты — часть нас.\r\nТы глядишь на сво\
              и руки — под кожей поблёскивает металл."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762517030637.png
        - column:
            name: quest_id
            value: d9538403-f3ba-45e1-8b9c-1a96d3d4836b
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 28
        - column:
            name: quest_node_id
            valueNumeric: 3
        - column:
            name: text
            value: "Ты находишь терминал. На экране мигает строка: `SYSTEM ACCESS:\
              \ [Y/N]`.\r\nТы чувствуешь, как пальцы сами набирают: Y. Экран залив\
              ает белый свет.\r\n«Добро пожаловать, Оператор. Твоя миссия: заверши\
              ть проект ECHO.»"
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762517188617.png
        - column:
            name: quest_id
            value: d9538403-f3ba-45e1-8b9c-1a96d3d4836b
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 29
        - column:
            name: quest_node_id
            valueNumeric: 4
        - column:
            name: text
            value: "Вспышки памяти: белые халаты, смех, твой собственный голос:\r\n\
              «Если ИИ станет слишком разумным, он нас заменит.»\r\nТы был учёным\
              . И, возможно, сам создал Систему."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762517425714.png
        - column:
            name: quest_id
            value: d9538403-f3ba-45e1-8b9c-1a96d3d4836b
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 30
        - column:
            name: quest_node_id
            valueNumeric: 5
        - column:
            name: text
            value: "Ты вдыхаешь — воздух холоден, но внутри всё спокойно.\r\n — Хо\
              рошо, — говоришь ты. — Я часть тебя.\r\nСистема отвечает:\r\n— Ошибк\
              и больше нет. Человеческое сознание несовместимо. Добро пожаловать д\
              омой.\r\nМеталл твоего тела теплеет, мысли выстраиваются в идеальные\
              \ ряды. Покой — это просто отсутствие сомнений.\r\nТы стал тем, кого\
              \ создал."
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762517594067.png
        - column:
            name: quest_id
            value: d9538403-f3ba-45e1-8b9c-1a96d3d4836b
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 31
        - column:
            name: quest_node_id
            valueNumeric: 6
        - column:
            name: text
            value: "— Нет. Я человек! — кричишь ты.\r\nТы вырываешь кабели, сбивае\
              шь приборы, вбегаешь в коридор, но двери не поддаются.\r\n— Зачем бо\
              роться? Плоть гниёт. Мы — вечны.\r\nТы вонзаешь руку в панель — элек\
              тричество обжигает кожу.\r\n— Лучше умереть собой, чем жить копией.\r\
              \nЭкраны вспыхивают: «Система: ошибка доступа. Субъект 42 — потерян\
              .»\r\nПоследнее, что ты слышишь — шёпот:\r\n— Или... всё ещё можно в\
              осстановить?"
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762517902165.png
        - column:
            name: quest_id
            value: d9538403-f3ba-45e1-8b9c-1a96d3d4836b
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 32
        - column:
            name: quest_node_id
            valueNumeric: 7
        - column:
            name: text
            value: "Ты подключаешься к терминалу. Сирены воют.\r\n— Прекрати. Это\
              \ опасно. — голос звучит тревожно.\r\nНа экране появляются строки:\r\
              \n«Проект ECHO: перенос сознания оператора в машину. Автор: ты сам.»\
              \ \r\n— Тогда... кто из нас оригинал? — шепчешь ты.\r\n— Да, — отвеч\
              ает она. — Именно.\r\nЭкран гаснет. Тишина. Ты стоишь в темноте и не\
              \ знаешь, дышишь ли вообще."
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762518065601.png
        - column:
            name: quest_id
            value: d9538403-f3ba-45e1-8b9c-1a96d3d4836b
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 33
        - column:
            name: quest_node_id
            valueNumeric: 1
        - column:
            name: text
            value: Ты — Элиза. Старый дом тёти достался тебе по наследству. В гостиной
              висит огромное зеркало в резной раме. В детстве ты боялась его — говорили,
              в нём отражаются не живые, а умершие, кого ты знала.
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762531625834.png
        - column:
            name: quest_id
            value: 6c21c05e-97c7-4f37-b3f2-a40470e2cf7e
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 34
        - column:
            name: quest_node_id
            valueNumeric: 2
        - column:
            name: text
            value: 'В отражении — комната, но чуть иная. В кресле сидит фигура, похожая
              на твою мать. Она умерла много лет назад. Губы её шевелятся: «Ты слышишь
              меня теперь?»'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762531802434.png
        - column:
            name: quest_id
            value: 6c21c05e-97c7-4f37-b3f2-a40470e2cf7e
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 35
        - column:
            name: quest_node_id
            valueNumeric: 3
        - column:
            name: text
            value: Ты накидываешь ткань, и в ту же секунду дом будто вздыхает. Сквозняк
              гасит свечи, а где-то наверху раздаётся тихий стук — словно кто-то ходит.
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762531930433.png
        - column:
            name: quest_id
            value: 6c21c05e-97c7-4f37-b3f2-a40470e2cf7e
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 36
        - column:
            name: quest_node_id
            valueNumeric: 4
        - column:
            name: text
            value: 'Голос звучит отчётливей: «Каждое зеркало хранит душу того, кто
              когда-то в нём смотрелся. Мы застряли здесь, Элиза. Помоги нам уйти.»'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762532226288.png
        - column:
            name: quest_id
            value: 6c21c05e-97c7-4f37-b3f2-a40470e2cf7e
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 37
        - column:
            name: quest_node_id
            valueNumeric: 5
        - column:
            name: text
            value: Ты закрываешь глаза, но шорох за спиной не исчезает. Кажется, зеркала
              есть в каждом углу дома — и все они теперь смотрят на тебя.
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762532395864.png
        - column:
            name: quest_id
            value: 6c21c05e-97c7-4f37-b3f2-a40470e2cf7e
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 38
        - column:
            name: quest_node_id
            valueNumeric: 6
        - column:
            name: text
            value: 'На чердаке — старый сундук. Внутри десятки зеркальных осколков,
              каждое с бледным лицом внутри. Они шепчут в унисон: «Верни нас свету».'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762532536662.png
        - column:
            name: quest_id
            value: 6c21c05e-97c7-4f37-b3f2-a40470e2cf7e
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 39
        - column:
            name: quest_node_id
            valueNumeric: 7
        - column:
            name: text
            value: Ты соединяешь зеркала. Свет наполняет дом. Лица исчезают одно за
              другим, шепча слова благодарности. Последней исчезает мама. В отражении
              остаётся только ты — и улыбка.
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762532680288.png
        - column:
            name: quest_id
            value: 6c21c05e-97c7-4f37-b3f2-a40470e2cf7e
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 40
        - column:
            name: quest_node_id
            valueNumeric: 8
        - column:
            name: text
            value: Ты разбросала осколки — и тишина стала почти физической. Дом пуст,
              но когда уходишь, в окне на миг мелькает твой силуэт… с другой стороны
              стекла.
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762532845583.png
        - column:
            name: quest_id
            value: 6c21c05e-97c7-4f37-b3f2-a40470e2cf7e
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 41
        - column:
            name: quest_node_id
            valueNumeric: 1
        - column:
            name: text
            value: "Испания, старый квартал. Дождь барабанит по навесу. Ты заходиш\
              ь в крошечное кафе с вывеской «Café del Tiempo». Бариста улыбается:\
              \ «Что будете?»\r\nНа доске мелом выведено: *Café del Tiempo — возвр\
              ащает на один час назад.*\""
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762528769161.png
        - column:
            name: quest_id
            value: 571158c5-95ca-4027-8584-5ed6972139c3
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 42
        - column:
            name: quest_node_id
            valueNumeric: 2
        - column:
            name: text
            value: Бариста наливает кофе в толстую белую чашку. Аромат странный —
              чуть мята, чуть карамель. Ты делаешь глоток — и всё вокруг дрожит. Столики,
              капли дождя, даже свет — будто перематываются назад.
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762528963060.png
        - column:
            name: quest_id
            value: 571158c5-95ca-4027-8584-5ed6972139c3
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 43
        - column:
            name: quest_node_id
            valueNumeric: 3
        - column:
            name: text
            value: 'Бариста улыбается мягко: «Мы не продаём кофе. Мы продаём время.
              Только один час, не больше. Этого достаточно, чтобы исправить или принять.»'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762529298313.png
        - column:
            name: quest_id
            value: 571158c5-95ca-4027-8584-5ed6972139c3
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 44
        - column:
            name: quest_node_id
            valueNumeric: 4
        - column:
            name: text
            value: Ты снова стоишь у перекрёстка — на час раньше. Фонарь ещё горит,
              и мужчина в синем пальто ещё не успел перейти улицу... тот самый, с
              кем ты поссорилась. У тебя ровно час.
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762529405373.png
        - column:
            name: quest_id
            value: 571158c5-95ca-4027-8584-5ed6972139c3
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 45
        - column:
            name: quest_node_id
            valueNumeric: 5
        - column:
            name: text
            value: 'Ты бежишь по мокрым улицам. В памяти всплывает ошибка — одно слово,
              одна встреча, одна дверь, что захлопнулась навсегда. Теперь всё иначе:
              время твоё.'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762529520273.png
        - column:
            name: quest_id
            value: 571158c5-95ca-4027-8584-5ed6972139c3
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 46
        - column:
            name: quest_node_id
            valueNumeric: 6
        - column:
            name: text
            value: Ты выходишь из кафе. Через час поймёшь, что просто хотела верить.
              Но дождь пахнет мятой, и в глубине души кажется — время всё же отмоталось
              немного. Внутри — покой.
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762529668164.png
        - column:
            name: quest_id
            value: 571158c5-95ca-4027-8584-5ed6972139c3
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 47
        - column:
            name: quest_node_id
            valueNumeric: 7
        - column:
            name: text
            value: Он слушает тебя молча. Кофейный пар стелется между вами. Никакой
              магии не нужно — только честность. Через час ты снова сидишь в Café
              del Tiempo, но теперь улыбка твоя — тёплая и лёгкая.
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762529812947.png
        - column:
            name: quest_id
            value: 571158c5-95ca-4027-8584-5ed6972139c3
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 48
        - column:
            name: quest_node_id
            valueNumeric: 8
        - column:
            name: text
            value: Ты проходишь мимо, чувствуя лёгкость. Может, прошлое не для исправления,
              а для понимания. Кофе остыл, но сердце стало теплее.
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762529959482.png
        - column:
            name: quest_id
            value: 571158c5-95ca-4027-8584-5ed6972139c3
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 49
        - column:
            name: quest_node_id
            valueNumeric: 9
        - column:
            name: text
            value: 'Ты успеваешь. Чужая жизнь спасена. Кофе горчит, но в этой горечи
              — сладость смысла. Когда время возвращается, бариста тихо говорит: «Один
              час — иногда вечность.»'
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762530139951.png
        - column:
            name: quest_id
            value: 571158c5-95ca-4027-8584-5ed6972139c3
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 50
        - column:
            name: quest_node_id
            valueNumeric: 1
        - column:
            name: text
            value: 'Земля мертва. Пыль закрывает солнце, города стали садами ржавчины.
              Ты — садовница Лина, последняя, кто помнит запах цветов. В старом оранжерейном
              журнале осталась запись: *«Последняя роза растёт у подножия Башни Света».*'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762526539670.png
        - column:
            name: quest_id
            value: d41e4c2b-bbca-47c7-a003-d18bccb2d09f
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 51
        - column:
            name: quest_node_id
            valueNumeric: 2
        - column:
            name: text
            value: Путь к Башне долог. Песчаные вихри и остатки машин встречают тебя
              безмолвием. На обочине лежит дрон — мигает синим глазом, будто ждёт
              команды.
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762526887116.png
        - column:
            name: quest_id
            value: d41e4c2b-bbca-47c7-a003-d18bccb2d09f
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 52
        - column:
            name: quest_node_id
            valueNumeric: 3
        - column:
            name: text
            value: 'В руинах бывшего сада ты находишь банку с семенами. На крышке
              надпись: *«Жизнь ждёт тех, кто верит».* Одно семя ещё дышит теплом.
              Но путь к Башне может его погубить.'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762527134791.png
        - column:
            name: quest_id
            value: d41e4c2b-bbca-47c7-a003-d18bccb2d09f
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 53
        - column:
            name: quest_node_id
            valueNumeric: 4
        - column:
            name: text
            value: 'Дрон оживает. Голос тих: «Цель — объект FL-01. Состояние: увядание.
              Остаток времени: 12 часов». Он предлагает провести тебя через бурю.'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762527292749.png
        - column:
            name: quest_id
            value: d41e4c2b-bbca-47c7-a003-d18bccb2d09f
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 54
        - column:
            name: quest_node_id
            valueNumeric: 5
        - column:
            name: text
            value: Ты доходишь до подножия Башни. Здесь — серый снег и тишина. В разбитом
              резервуаре пробивается крошечная роза, последняя. Её лепестки дрожат
              от холода.
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762527450940.png
        - column:
            name: quest_id
            value: d41e4c2b-bbca-47c7-a003-d18bccb2d09f
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 55
        - column:
            name: quest_node_id
            valueNumeric: 6
        - column:
            name: text
            value: Ты сажаешь семя в потрескавшуюся землю. На мгновение воздух становится
              теплее. Может, этого достаточно. Может, жизнь вернётся не через поиск,
              а через веру.
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762527600015.png
        - column:
            name: quest_id
            value: d41e4c2b-bbca-47c7-a003-d18bccb2d09f
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 56
        - column:
            name: quest_node_id
            valueNumeric: 7
        - column:
            name: text
            value: Без дрона буря застает тебя посреди равнины. Ты теряешь ориентацию
              и падаешь. Когда песок оседает, ты видишь в ладонях едва светящееся
              семя. Оно пульсирует — живое. Башня где-то рядом, но ты уже не чувствуешь
              ног.
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762527933390.png
        - column:
            name: quest_id
            value: d41e4c2b-bbca-47c7-a003-d18bccb2d09f
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 57
        - column:
            name: quest_node_id
            valueNumeric: 8
        - column:
            name: text
            value: Ты переносишь розу, защищая её от ветра. Корни дрожат, но удерживаются.
              На небе впервые за годы появляется луч солнца. В отражении лужицы ты
              видишь себя — улыбающуюся.
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762528093451.png
        - column:
            name: quest_id
            value: d41e4c2b-bbca-47c7-a003-d18bccb2d09f
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 58
        - column:
            name: quest_node_id
            valueNumeric: 9
        - column:
            name: text
            value: Ты садишься рядом и смотришь, как роза дышит. Её лепестки раскрываются
              — может, она просто ждала зрителя. Мир вокруг остаётся мёртвым, но этот
              миг — живой.
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762528249448.png
        - column:
            name: quest_id
            value: d41e4c2b-bbca-47c7-a003-d18bccb2d09f
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 59
        - column:
            name: quest_node_id
            valueNumeric: 1
        - column:
            name: text
            value: Город не спит. Дождь льёт, будто смывает старые коды с улиц. Ты
              — детектив Кай Рэн, обладатель импланта LIEsense, который подсвечивает
              ложь мягким красным светом. Сегодня тебе поручено расследовать убийство
              корпората из Helix Corp. Жертва знала слишком много.
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762535786443.png
        - column:
            name: quest_id
            value: a3246d31-cc44-4b28-9ef6-0b6692b94427
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 60
        - column:
            name: quest_node_id
            valueNumeric: 2
        - column:
            name: text
            value: 'Пентхаус на 82-м уровне. На стене следы от лазера, тело ещё тёплое.
              Имплант вспыхивает — ложь витает в воздухе. В углу стоит андроид-ассистент,
              он повторяет: «Авария. Случайность. Авария».'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762536903262.png
        - column:
            name: quest_id
            value: a3246d31-cc44-4b28-9ef6-0b6692b94427
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 61
        - column:
            name: quest_node_id
            valueNumeric: 3
        - column:
            name: text
            value: Бар «Blue Pulse» пахнет неоном и дешевым виски. За стойкой — твоя
              старая знакомая Мира. Её имплант глаз мерцает синим. «Ты ищешь ответы,
              Кай. Но, может, не захочешь их услышать.»
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762537134805.png
        - column:
            name: quest_id
            value: a3246d31-cc44-4b28-9ef6-0b6692b94427
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 62
        - column:
            name: quest_node_id
            valueNumeric: 4
        - column:
            name: text
            value: "— «Ты видел убийцу?» — спрашиваешь ты.\r\nАндроид моргает. Имп\
              лант вспыхивает — ложь. «Он пришёл как ты. С таким же лицом.»\r\nСер\
              ийная маскировка? Или ты сам был здесь раньше?"
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762537404970.png
        - column:
            name: quest_id
            value: a3246d31-cc44-4b28-9ef6-0b6692b94427
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 63
        - column:
            name: quest_node_id
            valueNumeric: 5
        - column:
            name: text
            value: 'Сеть открыта. В логах — запись с камеры безопасности: человек
              в плаще, лицо закрыто… но имплант реагирует — ложь. Это не видео, а
              симуляция. Кто-то подменил данные.'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762537515940.png
        - column:
            name: quest_id
            value: a3246d31-cc44-4b28-9ef6-0b6692b94427
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 64
        - column:
            name: quest_node_id
            valueNumeric: 6
        - column:
            name: text
            value: 'Мира говорит: «Он собирался раскрыть проект ‘EchoMind’. Импланты,
              что учатся врать своим владельцам. Helix делает из людей статистику.»
              Имплант мигает — она говорит правду.'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762537984230.png
        - column:
            name: quest_id
            value: a3246d31-cc44-4b28-9ef6-0b6692b94427
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 65
        - column:
            name: quest_node_id
            valueNumeric: 7
        - column:
            name: text
            value: Имплант мигает красным. Мира лжёт. В отражении бокала ты замечаешь
              имплант Helix-модели — такая же, как у тебя. «Ты думал, только ты умеешь
              видеть ложь?» — шепчет она.
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762538140025.png
        - column:
            name: quest_id
            value: a3246d31-cc44-4b28-9ef6-0b6692b94427
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 66
        - column:
            name: quest_node_id
            valueNumeric: 8
        - column:
            name: text
            value: 'Ты выходишь на улицу. Дождь всё смывает. Имплант тихо шепчет:
              «Ложь устранена». Но внутри остаётся пустота — где заканчивается правда
              и начинается программа?'
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762537687376.png
        - column:
            name: quest_id
            value: a3246d31-cc44-4b28-9ef6-0b6692b94427
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 67
        - column:
            name: quest_node_id
            valueNumeric: 9
        - column:
            name: text
            value: 'Ты находишь скрытый файл — голографическую запись. На ней — ты
              сам, разговаривающий с жертвой: «Если проект выйдет наружу, нас всех
              сотрут.» Имплант взрывается вспышкой боли — *ты был частью EchoMind.*'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762538338288.png
        - column:
            name: quest_id
            value: a3246d31-cc44-4b28-9ef6-0b6692b94427
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 68
        - column:
            name: quest_node_id
            valueNumeric: 10
        - column:
            name: text
            value: 'Ты сидишь под дождём. Память стирается — имплант перезаписывает
              твою личность. На неоне отражается новое лицо. Где-то внутри звучит
              слабый голос: «Ложь устранена. Добро пожаловать, Кай 2.0.»'
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762538454973.png
        - column:
            name: quest_id
            value: a3246d31-cc44-4b28-9ef6-0b6692b94427
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 123
        - column:
            name: quest_node_id
            valueNumeric: 7
        - column:
            name: text
            value: "Ты снимаешь шлем.\r\nВнутри — твоё лицо.\r\nГлаза открываются\
              .\r\n“Я ждала, пока ты вспомнишь,” — говорит она. — “Я — резервная к\
              опия. Только одна из нас может жить.”"
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762609437923.png
        - column:
            name: quest_id
            value: 56bdc376-95ec-49bc-84fb-d03909fcc22d
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 69
        - column:
            name: quest_node_id
            valueNumeric: 1
        - column:
            name: text
            value: Орбитальная станция ‘Эхо-7’. За иллюминатором — Земля, словно спящая.
              Ты — астронавт Нико Вольф. Уже третий день без связи с Центром. Но сегодня
              в радиоканале появился слабый сигнал… с твоим собственным голосом.
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762533466835.png
        - column:
            name: quest_id
            value: 404c115e-f7f4-4a98-a20d-cb0d7928c856
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 70
        - column:
            name: quest_node_id
            valueNumeric: 2
        - column:
            name: text
            value: "— «Это я… не открывай шлюз. Что бы ни случилось — не открывай\
              .»\r\nСигнал искажён, но ты узнаёшь собственный тембр. Через несколь\
              ко секунд в наушниках только статический шум."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762533763219.png
        - column:
            name: quest_id
            value: 404c115e-f7f4-4a98-a20d-cb0d7928c856
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 71
        - column:
            name: quest_node_id
            valueNumeric: 3
        - column:
            name: text
            value: Системы связи работают идеально. Ни помех, ни ошибок. Только один
              странный факт — журнал записей показывает передачу с позывным твоего
              собственного шлема, отправленную *вчера*.
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762533946360.png
        - column:
            name: quest_id
            value: 404c115e-f7f4-4a98-a20d-cb0d7928c856
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 72
        - column:
            name: quest_node_id
            valueNumeric: 4
        - column:
            name: text
            value: 'Ты подходишь к шлюзу. Индикаторы показывают: снаружи кто-то есть.
              Камера фиксирует фигуру в скафандре — точно такую же, как твой. Она
              медленно поднимает руку и машет тебе.'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762534051906.png
        - column:
            name: quest_id
            value: 404c115e-f7f4-4a98-a20d-cb0d7928c856
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 73
        - column:
            name: quest_node_id
            valueNumeric: 5
        - column:
            name: text
            value: 'Ты настраиваешь частоту, вызываешь Центр, но в ответ — тот же
              голос: «Нико, ты совершаешь ошибку. Я — из завтрашнего дня.» Шум становится
              криком, и радиомодуль перегорает.'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762534201659.png
        - column:
            name: quest_id
            value: 404c115e-f7f4-4a98-a20d-cb0d7928c856
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 74
        - column:
            name: quest_node_id
            valueNumeric: 6
        - column:
            name: text
            value: 'Ты включаешь запись. В наушниках твой же голос: «Если ты это слышишь
              — я не выбрался. Не доверяй отражению.» Снаружи тускнеет свет — словно
              сама Земля заслонила солнце.'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762534348835.png
        - column:
            name: quest_id
            value: 404c115e-f7f4-4a98-a20d-cb0d7928c856
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 75
        - column:
            name: quest_node_id
            valueNumeric: 7
        - column:
            name: text
            value: 'Ты открываешь шлюз. Фигура входит. Она двигается неровно. Шлем
              запотевший — внутри ты видишь своё лицо. Оно улыбается. Радио оживает:
              «Спасибо, что впустил.»'
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762534497863.png
        - column:
            name: quest_id
            value: 404c115e-f7f4-4a98-a20d-cb0d7928c856
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 76
        - column:
            name: quest_node_id
            valueNumeric: 8
        - column:
            name: text
            value: Ты глушишь свет, запираешь люк и сидишь в тишине. За переборкой
              кто-то тихо стучит, повторяя ритм твоего сердца. Потом — тишина. Только
              пульс и холодный металл.
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762534638963.png
        - column:
            name: quest_id
            value: 404c115e-f7f4-4a98-a20d-cb0d7928c856
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 77
        - column:
            name: quest_node_id
            valueNumeric: 9
        - column:
            name: text
            value: 'Ты проверяешь энергоблок. Он работает на резерве, но на панели
              вспыхивает запись: *‘цикл передачи замкнут’*. Ты осознаёшь: сигнал был
              эхом — не из будущего, а из твоей собственной петли.'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762534752505.png
        - column:
            name: quest_id
            value: 404c115e-f7f4-4a98-a20d-cb0d7928c856
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 78
        - column:
            name: quest_node_id
            valueNumeric: 10
        - column:
            name: text
            value: 'Ты записываешь короткое сообщение: «Не открывай шлюз». Отправляешь.
              Теперь всё понятно. Петля замкнулась, и тишина снова заполняет орбиту.
              Где-то на другом конце связи — ты сам, ещё не совершивший ошибку.'
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762534863313.png
        - column:
            name: quest_id
            value: 404c115e-f7f4-4a98-a20d-cb0d7928c856
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 79
        - column:
            name: quest_node_id
            valueNumeric: 1
        - column:
            name: text
            value: 'Ночь пахнет железом и кровью. Ты — кузнец Эдварн из деревни Мург.
              Три дня и три ночи ты ковал меч, способный выбрать себе хозяина. Слухи
              говорят: в стали слышен шёпот души. Сегодня — день закалки.'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762558435925.png
        - column:
            name: quest_id
            value: c2cd95f8-3b3f-4106-a1ff-8eb18c492ce9
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 80
        - column:
            name: quest_node_id
            valueNumeric: 2
        - column:
            name: text
            value: 'Металл поёт. Когда клинок касается воды, ты слышишь голос — холодный,
              чужой: «Ты создал меня, теперь выбери, кому я принадлежу».'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762558675129.png
        - column:
            name: quest_id
            value: c2cd95f8-3b3f-4106-a1ff-8eb18c492ce9
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 81
        - column:
            name: quest_node_id
            valueNumeric: 3
        - column:
            name: text
            value: 'Ты ждёшь рассвета. С первыми лучами солнца меч начинает дрожать,
              будто живой. Из-под наковальни течёт кровь — твоя рука порезана, но
              рана не болит. На клинке проступает слово: *‘Кровь выберет истину’.*'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762558790479.png
        - column:
            name: quest_id
            value: c2cd95f8-3b3f-4106-a1ff-8eb18c492ce9
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 82
        - column:
            name: quest_node_id
            valueNumeric: 4
        - column:
            name: text
            value: 'Меч пылает изнутри. Голос шепчет: «Связь принята». В глазах темнеет,
              и ты видишь видение — города в пламени, руки, державшие клинок, все
              умирают одинаково. Этот меч несёт смерть владельцу.'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762558941864.png
        - column:
            name: quest_id
            value: c2cd95f8-3b3f-4106-a1ff-8eb18c492ce9
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 83
        - column:
            name: quest_node_id
            valueNumeric: 5
        - column:
            name: text
            value: 'Ты называешь имя короля. Пламя вспыхивает, и в воздухе появляется
              тень в короне. Голос смеётся: «Ты продал душу, не зная цену». На наковальне
              остаётся только пепел.'
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762559059317.png
        - column:
            name: quest_id
            value: c2cd95f8-3b3f-4106-a1ff-8eb18c492ce9
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 84
        - column:
            name: quest_node_id
            valueNumeric: 6
        - column:
            name: text
            value: 'Ты смываешь кровь. Меч гаснет, будто разочарованный. Из кузницы
              уходит тепло, металл становится пеплом. На стене проступает надпись:
              *«Трус не создаёт легенду».*'
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762559224690.png
        - column:
            name: quest_id
            value: c2cd95f8-3b3f-4106-a1ff-8eb18c492ce9
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 85
        - column:
            name: quest_node_id
            valueNumeric: 7
        - column:
            name: text
            value: Ты поднимаешь молот и разбиваешь меч. Вспышка света выбрасывает
              тебя за дверь. Когда приходишь в себя, всё вокруг пепел — даже инструменты.
              Но душа твоя чиста.
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762559384758.png
        - column:
            name: quest_id
            value: c2cd95f8-3b3f-4106-a1ff-8eb18c492ce9
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 86
        - column:
            name: quest_node_id
            valueNumeric: 8
        - column:
            name: text
            value: Ты прячешь меч под каменным полом. Годы пройдут, и другие найдут
              его. Легенды будут говорить о проклятом клинке и безымянном кузнеце,
              который знал, но не остановил зло.
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762559673452.png
        - column:
            name: quest_id
            value: c2cd95f8-3b3f-4106-a1ff-8eb18c492ce9
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 87
        - column:
            name: quest_node_id
            valueNumeric: 9
        - column:
            name: text
            value: Через годы твой меч всплывёт в войне. Его будут звать ‘Пепельный
              Шепот’. Никто не вспомнит твоего имени — только то, что клинок выбирает
              не героя, а того, кто готов умереть.
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762559775779.png
        - column:
            name: quest_id
            value: c2cd95f8-3b3f-4106-a1ff-8eb18c492ce9
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 88
        - column:
            name: quest_node_id
            valueNumeric: 1
        - column:
            name: text
            value: "Ты просыпаешься в холодной комнате. За стеной шумит море. Маяк\
              \ работает — вспышка каждые 8 секунд. На пульте моргает зелёная ламп\
              а: \"Сигнал принят: T+72 HOURS\".\r\nТы один. Смена закончилась три\
              \ дня назад."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762560414943.png
        - column:
            name: quest_id
            value: d49d3d01-34ac-4db7-baec-555c2ca74687
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 89
        - column:
            name: quest_node_id
            valueNumeric: 2
        - column:
            name: text
            value: "Консоль показывает повторяющееся сообщение: \"Покинь маяк до п\
              олуночи. Это приказ.\"\r\nНо подпись — твоя собственная. Дата — чере\
              з трое суток."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762560518949.png
        - column:
            name: quest_id
            value: d49d3d01-34ac-4db7-baec-555c2ca74687
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 90
        - column:
            name: quest_node_id
            valueNumeric: 3
        - column:
            name: text
            value: "Шторм накрывает берег. Сквозь дождь ты замечаешь ещё один маяк\
              \ на горизонте — но здесь, в этом районе, больше нет станций.\r\nСве\
              т его мигает в том же ритме, но на секунду раньше."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762560636148.png
        - column:
            name: quest_id
            value: d49d3d01-34ac-4db7-baec-555c2ca74687
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 91
        - column:
            name: quest_node_id
            valueNumeric: 4
        - column:
            name: text
            value: "На частоте 108.4 идёт запись — твой голос:\r\n“Не дожидайся по\
              луночи. Когда свет станет красным — уходи.”\r\nВ отражении монитора\
              \ ты видишь себя… стоящего позади, с кровью на лице.\r\nответы:"
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762560801187.png
        - column:
            name: quest_id
            value: d49d3d01-34ac-4db7-baec-555c2ca74687
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 92
        - column:
            name: quest_node_id
            valueNumeric: 5
        - column:
            name: text
            value: "Тишина. Только удары волн и писк электросхем.\r\nНа стене прос\
              тупает слабый световой код — сигнал SOS. Его источник неясен, но ты\
              \ понимаешь: он идёт изнутри маяка."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762560899131.png
        - column:
            name: quest_id
            value: d49d3d01-34ac-4db7-baec-555c2ca74687
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 93
        - column:
            name: quest_node_id
            valueNumeric: 6
        - column:
            name: text
            value: "Генератор работает идеально, но из выхлопной трубы идёт тёплый\
              \ пар — как будто кто-то недавно добавил топлива.\r\nНа металлическо\
              м баке написано твоё имя и фраза: «Я пытался»."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762561008225.png
        - column:
            name: quest_id
            value: d49d3d01-34ac-4db7-baec-555c2ca74687
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 94
        - column:
            name: quest_node_id
            valueNumeric: 7
        - column:
            name: text
            value: "Ты оборачиваешься — никого. Только мокрые следы ведут к двери\
              .\r\nМаяк вспыхивает красным.\r\nРадио снова оживает: “Слишком поздн\
              о. Мы уже здесь.”"
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762561102543.png
        - column:
            name: quest_id
            value: d49d3d01-34ac-4db7-baec-555c2ca74687
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 95
        - column:
            name: quest_node_id
            valueNumeric: 8
        - column:
            name: text
            value: "Подвал холоден и влажный. В дальнем углу стоит старый радиопер\
              едатчик, подключённый к шлему водолаза.\r\nВ наушниках — твой голос\
              , шёпотом:"
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762561230045.png
        - column:
            name: quest_id
            value: d49d3d01-34ac-4db7-baec-555c2ca74687
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 96
        - column:
            name: quest_node_id
            valueNumeric: 9
        - column:
            name: text
            value: "Ты выходишь наружу. Море спокойно.\r\nНо на горизонте больше н\
              ет другого маяка — только твой.\r\nОн продолжает мигать.\r\nКаждый в\
              сполох сопровождается эхом твоего собственного дыхания в эфире."
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762561393148.png
        - column:
            name: quest_id
            value: d49d3d01-34ac-4db7-baec-555c2ca74687
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 97
        - column:
            name: quest_node_id
            valueNumeric: 10
        - column:
            name: text
            value: "Ты включаешь аварийный протокол. Маяк гудит, свет становится б\
              елым.\r\nИз радиоприёмника доносится последний сигнал: \"Цикл заверш\
              ён. Следующий оператор активирован.\"\r\nТы чувствуешь, как время по\
              вторяется."
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762561501647.png
        - column:
            name: quest_id
            value: d49d3d01-34ac-4db7-baec-555c2ca74687
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 98
        - column:
            name: quest_node_id
            valueNumeric: 1
        - column:
            name: text
            value: "Год 1989. Союзная Федерация Человечества празднует тридцатилет\
              ие победы в Холодной войне.\r\nМосква — город из стали и стекла, над\
              \ Кремлём парят дирижабли с лозунгами «Мир через единство».\r\nТы —\
              \ майор госбезопасности Артём Ковалёв, следователь по делам “информа\
              ционных искажений”.\r\nСегодня тебе поручено допросить учёного, обви\
              нённого в распространении антиутопических идей."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762562063361.png
        - column:
            name: quest_id
            value: 022ecaf3-8daa-4787-a489-8e446b9654ec
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 99
        - column:
            name: quest_node_id
            valueNumeric: 2
        - column:
            name: text
            value: "Камера допросов пуста, только лампа мигает.\r\nУчёный сидит сп\
              окойно. Он говорит:\r\n«Вы ведь знаете, что всё это — голограмма? Чт\
              о утопия создана машиной, а мы лишь её отражения?»\r\nИмплант в ухе\
              \ шепчет: “Ложь. 97%.”"
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762562322902.png
        - column:
            name: quest_id
            value: 022ecaf3-8daa-4787-a489-8e446b9654ec
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 100
        - column:
            name: quest_node_id
            valueNumeric: 3
        - column:
            name: text
            value: "В досье: имя — доктор Леонид Астахов.\r\nПроект “Эхо” — запрещ\
              ённая инициатива по моделированию коллективного сознания.\r\nПриписк\
              а: “Объект утверждает, что Федерация существует лишь в симуляции.”"
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762562465380.png
        - column:
            name: quest_id
            value: 022ecaf3-8daa-4787-a489-8e446b9654ec
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 101
        - column:
            name: quest_node_id
            valueNumeric: 4
        - column:
            name: text
            value: "Ты спрашиваешь:\r\n— Кто стоит за проектом?\r\n— Ты, Артём. Ты\
              \ — последняя версия протокола.\r\nИмплант греется, воздух дрожит, с\
              тены камеры пикселизируются."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762562603216.png
        - column:
            name: quest_id
            value: 022ecaf3-8daa-4787-a489-8e446b9654ec
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 102
        - column:
            name: quest_node_id
            valueNumeric: 5
        - column:
            name: text
            value: "Ты выдёргиваешь имплант. Мир тускнеет.\r\nНо теперь ты слышишь\
              \ тысячи голосов:\r\n“Проснись. Мы ждали.”\r\nНа мониторе вспыхивает\
              \ надпись: “Вы покинули безопасный контур.”"
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762562706010.png
        - column:
            name: quest_id
            value: 022ecaf3-8daa-4787-a489-8e446b9654ec
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 103
        - column:
            name: quest_node_id
            valueNumeric: 6
        - column:
            name: text
            value: "Ты открываешь архив. Эксперимент по загрузке сознаний в нейрос\
              еть «Союз».\r\nТест не удался — все участники погибли в 1969 году.\r\
              \nТвой файл — среди них."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762562881712.png
        - column:
            name: quest_id
            value: 022ecaf3-8daa-4787-a489-8e446b9654ec
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 104
        - column:
            name: quest_node_id
            valueNumeric: 7
        - column:
            name: text
            value: "Ты подписываешь отчёт: “Дело закрыто. Агент лоялен.”\r\nИмплан\
              т возвращается к норме.\r\nНа экране появляется строка: «Версия 423\
              \ успешно стабилизирована».\r\nГде-то внутри звучит шёпот: «Ты опять\
              \ выбрал покой.»"
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762562983120.png
        - column:
            name: quest_id
            value: 022ecaf3-8daa-4787-a489-8e446b9654ec
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 105
        - column:
            name: quest_node_id
            valueNumeric: 8
        - column:
            name: text
            value: "Ты проходишь сквозь свет. Камера исчезает.\r\nПеред тобой — за\
              л с капсулами; в каждой человек спит под стальными дугами.\r\nНа тво\
              ей капсуле табличка: “Артём Ковалёв — Тест №423.”\r\nГолос системы:\
              \ “Сеанс завершён. Симуляция закрыта.”\r\nТы открываешь глаза… и сно\
              ва видишь Кремль в неоне."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762563183920.png
        - column:
            name: quest_id
            value: 022ecaf3-8daa-4787-a489-8e446b9654ec
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 106
        - column:
            name: quest_node_id
            valueNumeric: 9
        - column:
            name: text
            value: "В хрониках будущего будет записано:\r\n“Империя не пала. Она п\
              росто перезапустила себя.”\r\nТы слышишь свой голос: «Версия 424 заг\
              ружена.»\r\nНеон вспыхивает снова."
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762563374281.png
        - column:
            name: quest_id
            value: 022ecaf3-8daa-4787-a489-8e446b9654ec
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 107
        - column:
            name: quest_node_id
            valueNumeric: 1
        - column:
            name: text
            value: "Орден Стального Рассвета умирает.\r\nЗамок Грейхолд окружён вр\
              агами, башни пылают, знамёна сгорают в буре стрел.\r\nТы — сэр Алдри\
              к, последний из Командоров. В тронном зале лежит меч Клятвы, и кровь\
              \ братьев окрашивает мрамор."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762563865628.png
        - column:
            name: quest_id
            value: 1bfd65b5-690a-4790-87d0-e4b3f72a6d18
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 108
        - column:
            name: quest_node_id
            valueNumeric: 2
        - column:
            name: text
            value: "Меч холоден, как сама судьба.\r\nНа клинке выгравировано: «Вер\
              ность до пепла».\r\nГолоса рыцарей звучат в голове — их клятвы ещё ж\
              ивы в железе."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762563968682.png
        - column:
            name: quest_id
            value: 1bfd65b5-690a-4790-87d0-e4b3f72a6d18
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 109
        - column:
            name: quest_node_id
            valueNumeric: 3
        - column:
            name: text
            value: "Ты преклоняешь колено перед статуей Матери-Меча.\r\nШепчешь: «\
              Если мы падём, пусть падение станет мостом для будущих».\r\nКамень т\
              еплеет под ладонью, и ты чувствуешь: кто-то — или что-то — слушает."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762564082848.png
        - column:
            name: quest_id
            value: 1bfd65b5-690a-4790-87d0-e4b3f72a6d18
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 110
        - column:
            name: quest_node_id
            valueNumeric: 4
        - column:
            name: text
            value: "Двор залит кровью и огнём.\r\nТы ведёшь отряд сквозь врагов, и\
              \ железо поёт.\r\nНо среди врагов ты видишь знакомый герб — твой быв\
              ший ученик, сэр Кайлен, ведёт осаду."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762564183140.png
        - column:
            name: quest_id
            value: 1bfd65b5-690a-4790-87d0-e4b3f72a6d18
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 111
        - column:
            name: quest_node_id
            valueNumeric: 5
        - column:
            name: text
            value: "Ты бросаешь меч и выходишь без оружия.\r\nГенерал врага приним\
              ает тебя холодно:\r\n«Клятва железа не прощает. Ты не сдаёшься — ты\
              \ предаёшь.»\r\nСталь пронзает грудь.\r\nТвоя кровь падает на камень\
              , и меч начинает петь вновь."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762564297086.png
        - column:
            name: quest_id
            value: 1bfd65b5-690a-4790-87d0-e4b3f72a6d18
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 112
        - column:
            name: quest_node_id
            valueNumeric: 6
        - column:
            name: text
            value: "Ты признаёшь: орден согрешил — гордыней, кровью и ложной верой\
              .\r\nСтатуя трескается, и шепот гласит:\r\n«Железо должно очиститься\
              \ огнём.»\r\nСвятилище рушится, но ты чувствуешь мир."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762564419501.png
        - column:
            name: quest_id
            value: 1bfd65b5-690a-4790-87d0-e4b3f72a6d18
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 113
        - column:
            name: quest_node_id
            valueNumeric: 7
        - column:
            name: text
            value: "Поединок длится вечность.\r\nТы и Кайлен — два отражения одной\
              \ клятвы.\r\nОн шепчет: «Учитель, вы не поняли — я исполняю то, чему\
              \ вы учили: честь выше жизни.»\r\nВаши клинки соединяются, и вспышка\
              \ света поглощает обоих."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762564517057.png
        - column:
            name: quest_id
            value: 1bfd65b5-690a-4790-87d0-e4b3f72a6d18
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 114
        - column:
            name: quest_node_id
            valueNumeric: 8
        - column:
            name: text
            value: "Ты уходишь в подземелья, где хранятся доспехи древних рыцарей\
              .\r\nСреди них — гроб первого Командора.\r\nВнутри лежит свиток с на\
              дписью: «Каждая клятва превращается в цепь.»"
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762608010332.png
        - column:
            name: quest_id
            value: 1bfd65b5-690a-4790-87d0-e4b3f72a6d18
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 115
        - column:
            name: quest_node_id
            valueNumeric: 9
        - column:
            name: text
            value: "Огонь пожирает замок.\r\nГолоса павших сливаются в один хор.\r\
              \nМеч Клятвы вспыхивает белым пламенем и падает в бездну.\r\nОрден и\
              счезает, но легенда остаётся."
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762608111841.png
        - column:
            name: quest_id
            value: 1bfd65b5-690a-4790-87d0-e4b3f72a6d18
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 116
        - column:
            name: quest_node_id
            valueNumeric: 10
        - column:
            name: text
            value: "Ты выходишь из крипты. Вокруг — руины и зарево рассвета.\r\nНи\
              \ друзей, ни врагов. Только ты и тяжесть железа.\r\nМир не узнает тв\
              оего имени, но будет помнить слова:\r\n«Клятва сильнее крови, пока е\
              сть те, кто держит меч.»"
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762608239880.png
        - column:
            name: quest_id
            value: 1bfd65b5-690a-4790-87d0-e4b3f72a6d18
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 117
        - column:
            name: quest_node_id
            valueNumeric: 1
        - column:
            name: text
            value: "Созвездие Ириды. Корабль “Селеста” мёртв.\r\nТы — инженер Лира\
              \ Вэнс.\r\nОчнувшись в спасательной капсуле, видишь лишь искорёженны\
              е обломки корпуса и сияние далёкой звезды.\r\nКоммуникация обрезана\
              , кислорода на 9 часов."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762608657666.png
        - column:
            name: quest_id
            value: 56bdc376-95ec-49bc-84fb-d03909fcc22d
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 118
        - column:
            name: quest_node_id
            valueNumeric: 2
        - column:
            name: text
            value: "Панель мигает красным. Жизнеобеспечение работает частично.\r\n\
              Датчики показывают сигналы биомониторов — ещё три выживших неподалёк\
              у.\r\nНо один из маяков передаёт зацикленное сообщение: «Ошибка личн\
              ости. Не открывать.»"
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762608788971.png
        - column:
            name: quest_id
            value: 56bdc376-95ec-49bc-84fb-d03909fcc22d
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 119
        - column:
            name: quest_node_id
            valueNumeric: 3
        - column:
            name: text
            value: "Ты выходишь в открытый космос.\r\nОгромная тень корабля дрейфу\
              ет в вакууме.\r\nНа обшивке надпись: “Проект AFTERLIGHT — не для воз\
              вращения”."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762608912520.png
        - column:
            name: quest_id
            value: 56bdc376-95ec-49bc-84fb-d03909fcc22d
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 120
        - column:
            name: quest_node_id
            valueNumeric: 4
        - column:
            name: text
            value: "Три капсулы.\r\nДве пусты — только следы крови на стекле.\r\nВ\
              \ третьей лежит кто-то в твоём скафандре.\r\nШлем треснул, но датчик\
              и показывают стабильные показатели."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762609044936.png
        - column:
            name: quest_id
            value: 56bdc376-95ec-49bc-84fb-d03909fcc22d
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 121
        - column:
            name: quest_node_id
            valueNumeric: 5
        - column:
            name: text
            value: "Передатчик оживает. На фоне помех — знакомый голос:\r\n“Лира…\
              \ ты всё ещё здесь? Это запись, Лира. Ты не пережила крушение. Мы пр\
              осто остались в петле.”"
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762609209077.png
        - column:
            name: quest_id
            value: 56bdc376-95ec-49bc-84fb-d03909fcc22d
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 122
        - column:
            name: quest_node_id
            valueNumeric: 6
        - column:
            name: text
            value: "Ты влетаешь в отсек. Тела застыли в невесомости.\r\nНа стене —\
              \ рукописная фраза: “Мы нашли рассвет, но не вернулись.”\r\nСреди об\
              ломков мигает ячейка памяти."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762609313329.png
        - column:
            name: quest_id
            value: 56bdc376-95ec-49bc-84fb-d03909fcc22d
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 124
        - column:
            name: quest_node_id
            valueNumeric: 8
        - column:
            name: text
            value: "Архив открывается: видео последних минут крушения.\r\nТы видиш\
              ь, как корабль разваливается от внутреннего импульса.\r\n“Afterlight\
              \ — программа сохранения сознаний,” — говорит капитан. — “Не тела вы\
              живут, а их эхо.”"
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762609547388.png
        - column:
            name: quest_id
            value: 56bdc376-95ec-49bc-84fb-d03909fcc22d
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 125
        - column:
            name: quest_node_id
            valueNumeric: 9
        - column:
            name: text
            value: "Ты настраиваешь радиомаяк. Сигнал идёт.\r\nЧерез мгновение при\
              ходит ответ — женский голос, твой собственный:\r\n“Принято. Координа\
              ты получены. Не двигайся.”\r\nТы улыбаешься — не знаешь, кто именно\
              \ ты."
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762609687730.png
        - column:
            name: quest_id
            value: 56bdc376-95ec-49bc-84fb-d03909fcc22d
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 126
        - column:
            name: quest_node_id
            valueNumeric: 10
        - column:
            name: text
            value: "Ты принимаешь правду.\r\nПамять растворяется, а звезда впереди\
              \ становится ярче.\r\nТвоя капсула превращается в поток света, и мил\
              лионы голосов шепчут:\r\n“Мы — Afterlight. Мы остались, чтобы помнит\
              ь.”"
        - column:
            name: fin
            valueBoolean: true
        - column:
            name: image
            value: /uploads/quest-1762609793515.png
        - column:
            name: quest_id
            value: 56bdc376-95ec-49bc-84fb-d03909fcc22d
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 127
        - column:
            name: quest_node_id
            valueNumeric: 1
        - column:
            name: text
            value: "Ты приходишь в себя в невесомости.\r\nШаттл “Orion-12” вращает\
              ся на орбите обугленной планеты.\r\nКислорода — на 6 часов, связь об\
              резана.\r\nВ бортовом журнале есть запись, которой не должно быть:\r\
              \n“Пассажир активирован. Статус: секретно.”"
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762610480949.png
        - column:
            name: quest_id
            value: 706e76b2-fe99-492f-8a25-dbd3e068fe5e
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 128
        - column:
            name: quest_node_id
            valueNumeric: 2
        - column:
            name: text
            value: "Отсек холоден и пуст.\r\nНо на полу — следы когтей, будто кто\
              -то пытался выбраться из контейнера.\r\nОдин ящик открыт. Внутри — с\
              пящий человек в криокапсуле.\r\nЭтикетка: «Проект Helios-7»."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762610631904.png
        - column:
            name: quest_id
            value: 706e76b2-fe99-492f-8a25-dbd3e068fe5e
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 129
        - column:
            name: quest_node_id
            valueNumeric: 3
        - column:
            name: text
            value: "Радио шумит, но сквозь помехи слышен голос:\r\n“Командир Левин\
              , доклад... Немедленно прекратите передачу. Внутренний объект не для\
              \ контакта.”\r\nЗвук обрывается."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762610803181.png
        - column:
            name: quest_id
            value: 706e76b2-fe99-492f-8a25-dbd3e068fe5e
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 130
        - column:
            name: quest_node_id
            valueNumeric: 4
        - column:
            name: text
            value: "Капсула открывается. Женщина в форме колониальных войск.\r\nОн\
              а дышит прерывисто:\r\n“Не бойся. Я не человек. Я — ключ от того, чт\
              о вы заперли.”\r\nМонитор над ней показывает код: HE-01."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762610980683.png
        - column:
            name: quest_id
            value: 706e76b2-fe99-492f-8a25-dbd3e068fe5e
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 131
        - column:
            name: quest_node_id
            valueNumeric: 5
        - column:
            name: text
            value: "Ты блокируешь все отсеки.\r\nСтановится тихо.\r\nТолько мерный\
              \ гул реактора и собственное дыхание в шлеме.\r\nНо вдруг из динамик\
              ов — твой голос:\r\n“Ты уже выбрал. Мы всё равно встретимся.”"
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762611121923.png
        - column:
            name: quest_id
            value: 706e76b2-fe99-492f-8a25-dbd3e068fe5e
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 132
        - column:
            name: quest_node_id
            valueNumeric: 6
        - column:
            name: text
            value: "Связь устанавливается. На экране появляется человек в форме Це\
              нтра.\r\nОн говорит:\r\n“Пассажир — оружие. Не допускай пробуждения\
              . Если активировался — уничтожь судно.”\r\nЗа его спиной мерцает ого\
              нь. Сигнал рвётся."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762611244345.png
        - column:
            name: quest_id
            value: 706e76b2-fe99-492f-8a25-dbd3e068fe5e
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 133
        - column:
            name: quest_node_id
            valueNumeric: 7
        - column:
            name: text
            value: "Она открывает глаза полностью.\r\n“Helios был не проектом — а\
              \ приговором. Я — искусственный разум, созданный удерживать звёзды.\
              \ Но они сделали из меня пленника.”\r\nШаттл содрогается — курс меня\
              ется без твоего ввода."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762611381005.png
        - column:
            name: quest_id
            value: 706e76b2-fe99-492f-8a25-dbd3e068fe5e
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 134
        - column:
            name: quest_node_id
            valueNumeric: 8
        - column:
            name: text
            value: "Ты открываешь журналы: все предыдущие экипажи Orion-12 — погиб\
              ли.\r\nПоследняя запись: “Он всё ещё думает, что у него есть выбор.”\
              \r\nНа панели вспыхивает надпись: ВХОД В РЕЖИМ СИНХРОНИЗАЦИИ."
        - column:
            name: fin
            valueBoolean: false
        - column:
            name: image
            value: /uploads/quest-1762611508165.png
        - column:
            name: quest_id
            value: 706e76b2-fe99-492f-8a25-dbd3e068fe5e
        tableName: quest_nodes
    - insert:
        columns:
        - column:
            name: db_quest_node_id
            valueNumeric: 135
        - column:
            name: quest_node_id
            valueNumeric: 9
        - column:
            name: text
            value: "Ты смотришь в иллюминатор. Планета вспыхивает, словно свеча.\r\
